<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" rx="18" fill="#111827"/>
  <rect width="1200" height="52" rx="18" fill="#1f2937"/>
  <circle cx="28" cy="26" r="8" fill="#ff5f57"/>
  <circle cx="54" cy="26" r="8" fill="#febc2e"/>
  <circle cx="80" cy="26" r="8" fill="#28c840"/>
  <text x="600" y="33" text-anchor="middle" fill="#d1d5db" font-family="Menlo, Monaco, monospace" font-size="16">Lab0 — conflict resolved</text>
  <g fill="#e5e7eb" font-family="Menlo, Monaco, monospace" font-size="22">
    <text x="34" y="100"><tspan fill="#34d399">$</tspan> git add main.c</text>
    <text x="34" y="140"><tspan fill="#34d399">$</tspan> git commit -m "merge: integrate feature branch and resolve conflict"</text>
    <text x="34" y="180">[main 9c2b4a4] merge: integrate feature branch and resolve conflict</text>
    <text x="34" y="230"><tspan fill="#34d399">$</tspan> git status --short --branch</text>
    <text x="34" y="270">## main...origin/main [ahead 4]</text>
    <text x="34" y="320"><tspan fill="#34d399">$</tspan> git log --graph --oneline --decorate -6</text>
    <text x="34" y="360">*   9c2b4a4 (HEAD -&gt; main) merge: integrate feature branch and resolve conflict</text>
    <text x="34" y="400">|\</text>
    <text x="34" y="440">| * 30f685b (feature) feat: customize feature branch message</text>
    <text x="34" y="480">* | c13aa54 feat: customize main branch message</text>
    <text x="34" y="520">|/</text>
    <text x="34" y="560">* ae600df feat: complete greeting TODO</text>
    <text x="34" y="610"><tspan fill="#34d399">$</tspan> make &amp;&amp; ./main</text>
    <text x="34" y="650" fill="#a7f3d0">Main branch: keep the stable version ready to use.</text>
    <text x="34" y="690" fill="#a7f3d0">Feature branch: experiment safely before merging.</text>
  </g>
</svg>
